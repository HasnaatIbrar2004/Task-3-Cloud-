services:
  db:
    image: postgres:16-alpine
    container_name: voting-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives restarts (removed by `down -v`)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # no "ports:" on purpose - only the api container can reach the database

  api:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
    image: voting-api:task3
    container_name: voting-api
    depends_on:
      db:
        condition: service_healthy        # wait until Postgres accepts connections
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # "db" is the service name above = the hostname on the compose network
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_DIR: /app/logs
    volumes:
      - ./logs:/app/logs                  # logs/logs.log shows up in the repo on your machine
    restart: unless-stopped

volumes:
  pgdata:
